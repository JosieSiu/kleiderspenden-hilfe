<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kleiderspenden Hilfe – Registrierung</title>

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

<header>
  <div class="header-inner">
    <img src="assets/logo.png" alt="Kleiderspenden Hilfe Logo" class="logo">
    <nav>
      <a href="index.html">Start</a>
      <a href="#">Registrierung</a>
      <a href="#">Kontakt</a>
    </nav>
  </div>
</header>

<main>

<section class="intro">
  <h1>Spende registrieren</h1>
  <p>Bitte gib die Daten deiner Kleiderspende ein.</p>
</section>

<section class="form-section">

<form id="donationForm">

<label>Übergabeart</label>
<select id="method" required>
<option value="">Bitte auswählen</option>
<option value="office">Übergabe an der Geschäftsstelle</option>
<option value="pickup">Abholung durch Sammelfahrzeug</option>
</select>

<div id="addressFields" style="display:none; margin-top:10px;">
  
<label>Abholadresse</label>
<input type="text" id="address" placeholder="Straße, Hausnummer">

<label>Postleitzahl</label>
<input type="text" id="plz" maxlength="5" placeholder="PLZ">

<p id="plzError" style="color:red; font-size:14px;"></p>

</div>

<br>

<label>Art der Kleidung</label>
<select id="clothing" required>
<option>Jacken</option>
<option>Hosen</option>
<option>Schuhe</option>
<option>Winterkleidung</option>
<option>Kinderkleidung</option>
</select>

<label>Krisengebiet</label>
<select id="crisis" required>
<option>Ukraine</option>
<option>Syrien</option>
<option>Somalia</option>
<option>Türkei (Erdbebenregion)</option>
</select>

<button type="submit">Spende registrieren</button>

</form>

</section>
</main>

<footer>
  <p>© 2026 Kleiderspenden Hilfe · Datenschutz · Impressum</p>
</footer>

<script>

const method = document.getElementById("method");
const addressFields = document.getElementById("addressFields");
const plzInput = document.getElementById("plz");
const plzError = document.getElementById("plzError");

const officePrefix = "39"; // Beispiel für Burg PLZ

/* Anzeige Adresse nur bei Abholung */

method.addEventListener("change", function(){

if(this.value === "pickup"){
addressFields.style.display = "block";
}else{
addressFields.style.display = "none";
plzError.textContent = "";
}

});

/* Live-PLZ-Prüfung */

plzInput.addEventListener("input", function(){

let plz = plzInput.value;

if(plz.length >= 2){

if(plz.substring(0,2) !== officePrefix){

plzError.textContent =
"Die Adresse liegt außerhalb des Sammelgebietes.";

}else{

plzError.textContent = "";

}

}

});

/* Formular senden */

document.getElementById("donationForm")
.addEventListener("submit", function(event){

event.preventDefault();

let methodValue = method.value;
let clothing = document.getElementById("clothing").value;
let crisis = document.getElementById("crisis").value;
let address = document.getElementById("address").value;
let plz = plzInput.value;

let url =
"confirmation.html?method=" + encodeURIComponent(methodValue) +
"&clothing=" + encodeURIComponent(clothing) +
"&crisis=" + encodeURIComponent(crisis) +
"&address=" + encodeURIComponent(address) +
"&plz=" + encodeURIComponent(plz);

window.location.href = url;

});

</script>

</body>
</html>
